<html lang="en">

    <title>AdvocacyPrep — Tactical IEP & 504 Meeting Preparation</title>
    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || origFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore fallback
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
